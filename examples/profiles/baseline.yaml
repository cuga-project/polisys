# Policy off. Every component is off, so nothing is added to the agent: no hooks, no tools, no notes.
# Use it as the control arm of an experiment.
policy:
  package: none
  sources: {data: false, discovery: false, request: false}
  checkers:
    rules: off
    gate: {mode: off}
    verifier: {mode: off}
    write_checks: off
  organizers:
    procedure_tools: off
    guide: off
    loop: off
    sop_tracker: off
    navigator: off
    requirements_tracker: off
  obligations: {producers: []}
  decisions: {mode: off}
