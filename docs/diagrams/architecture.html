<rect width="1600" height="890" fill="#ffffff"/>
<text x="40" y="58" class="h1">polisys</text>
<text x="40" y="88" class="lead">The enterprise's policies become checks that run inside any agent harness.</text>
<rect x="40" y="116" width="400" height="640" rx="18" fill="#fffbeb" stroke="#b45309" stroke-opacity=".35" stroke-width="2"/>
<text x="64" y="154" class="panel" fill="#b45309">ENTERPRISE</text>
<text x="64" y="178" class="sub">what the company owns</text>
<rect x="520" y="116" width="560" height="640" rx="18" fill="#eff6ff" stroke="#1d4ed8" stroke-opacity=".35" stroke-width="2"/>
<text x="544" y="154" class="panel" fill="#1d4ed8">POLISYS</text>
<text x="544" y="178" class="sub">compile once, check at every step</text>
<rect x="1160" y="116" width="400" height="640" rx="18" fill="#ecfdf5" stroke="#047857" stroke-opacity=".35" stroke-width="2"/>
<text x="1184" y="154" class="panel" fill="#047857">AGENT HARNESS</text>
<text x="1184" y="178" class="sub">the host that runs the agent loop</text>

<text x="86" y="228" class="title">Policy documents</text>
<text x="86" y="254" class="body">Handbooks, SOPs, rule lists</text>
<text x="86" y="275" class="body">PDF, Word, HTML, Markdown</text>
<rect x="64" y="370" width="352" height="150" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M65,382 a11,11 0 0 1 11,-11 h0 v148 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>
<rect x="64" y="384" width="5" height="122" rx="2.5" fill="#b45309"/>
<text x="86" y="402" class="title">Policy owner</text>
<text x="86" y="428" class="body">Answers the open questions:</text>
<text x="86" y="449" class="body">an ambiguity is asked,</text>
<text x="86" y="470" class="body">never guessed</text>
<rect x="64" y="544" width="352" height="150" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M65,556 a11,11 0 0 1 11,-11 h0 v148 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>
<rect x="64" y="558" width="5" height="122" rx="2.5" fill="#b45309"/>
<text x="86" y="576" class="title">Systems and tools</text>
<text x="86" y="602" class="body">Tickets, mail, sheets, records</text>
<text x="86" y="623" class="body">described by tool schemas</text>
<rect x="544" y="196" width="232" height="150" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M545,208 a11,11 0 0 1 11,-11 h0 v148 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>
<rect x="544" y="210" width="5" height="122" rx="2.5" fill="#1d4ed8"/>
<text x="566" y="228" class="title">Compile</text>
<text x="566" y="254" class="body">Reads the documents</text>
<text x="566" y="275" class="body">and the tool schemas</text>
<text x="566" y="296" class="body">Claude skill, or an</text>
<text x="566" y="317" class="body">open-model pipeline</text>
<rect x="824" y="196" width="232" height="150" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M825,208 a11,11 0 0 1 11,-11 h0 v148 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>
<rect x="824" y="210" width="5" height="122" rx="2.5" fill="#1d4ed8"/>
<text x="846" y="228" class="title">Policy package</text>
<text x="846" y="254" class="body">One JSON file with</text>
<text x="846" y="275" class="body">rules, procedures,</text>
<text x="846" y="296" class="body">obligations, questions</text>
<text x="846" y="317" class="body">and tests</text>
<rect x="544" y="372" width="232" height="90" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M545,384 a11,11 0 0 1 11,-11 h0 v88 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>

<text x="566" y="430" class="body">One YAML file:</text>
<text x="566" y="451" class="body">which checks run</text>
<rect x="824" y="372" width="232" height="90" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M825,384 a11,11 0 0 1 11,-11 h0 v88 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>
<rect x="824" y="386" width="5" height="62" rx="2.5" fill="#1d4ed8"/>
<text x="846" y="404" class="title mono">build_runtime</text>
<text x="846" y="430" class="body">profile + package become</text>
<text x="846" y="451" class="body">hooks and tools</text>
<rect x="544" y="488" width="512" height="168" rx="12" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>

<rect x="562" y="534" width="238" height="50" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="576" y="555" class="chip">Typed rules</text>
<text x="576" y="574" class="chipd">stop a wrong call</text>
<rect x="810" y="534" width="238" height="50" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="824" y="555" class="chip">Procedure gate</text>
<text x="824" y="574" class="chipd">guide the case</text>
<rect x="562" y="592" width="238" height="50" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="576" y="613" class="chip">Obligation ledger</text>
<text x="576" y="632" class="chipd">find missing work</text>
<rect x="810" y="592" width="238" height="50" rx="9" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
<text x="824" y="613" class="chip">Control levels</text>
<text x="824" y="632" class="chipd">fewer checks for strong models</text>
<rect x="544" y="680" width="512" height="60" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M545,692 a11,11 0 0 1 11,-11 h0 v58 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>
<rect x="544" y="694" width="5" height="32" rx="2.5" fill="#1d4ed8"/>
<text x="566" y="712" class="title">Audit log</text>
<text x="656" y="718" class="body">one line per decision, and per failed check</text>
<rect x="1184" y="196" width="352" height="180" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M1185,208 a11,11 0 0 1 11,-11 h0 v178 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>
<rect x="1184" y="210" width="5" height="152" rx="2.5" fill="#047857"/>
<text x="1206" y="228" class="title">Nine lifecycle hooks</text>
<text x="1206" y="254" class="body">polisys.hooks</text>
<text x="1206" y="275" class="body"></text>
<text x="1206" y="296" class="body">Receives a stop, a note</text>
<text x="1206" y="317" class="body">or a follow-up at each</text>
<text x="1206" y="338" class="body">call and reply</text>
<rect x="1184" y="470" width="352" height="180" rx="12" fill="#fff" stroke="#e5e7eb" stroke-width="1.5"/>
<path d="M1185,482 a11,11 0 0 1 11,-11 h0 v178 h0 a11,11 0 0 1 -11,-11 z" fill="none"/>
<rect x="1184" y="484" width="5" height="152" rx="2.5" fill="#047857"/>
<text x="1206" y="502" class="title">Agent loop</text>
<text x="1206" y="528" class="body">Model and tools</text>
<text x="1206" y="549" class="body"></text>
<text x="1206" y="570" class="body">Any harness that can</text>
<text x="1206" y="591" class="body">call the hooks. Tested</text>
<text x="1206" y="612" class="body">with the CUGA agent</text>
